kind = "web"
previewPath = "/"
title = "Roman Parthia Remastered — Staff Panel"
version = "1.0.0"
id = "artifacts/staff-panel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21649

[services.development]
run = "pnpm --filter @workspace/staff-panel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/staff-panel", "run", "build" ]
publicDir = "artifacts/staff-panel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21649"
BASE_PATH = "/"
